<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Maritime Wrap Co.</title>
<meta name="robots" content="noindex">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18339107903"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18339107903');

  var lead = JSON.parse(sessionStorage.getItem('mwc_lead') || 'null');
  if (lead) {
    var nameParts = lead.name.trim().split(/\s+/);
    gtag('set', 'user_data', {
      email: lead.email,
      phone_number: lead.phone,
      address: {
        first_name: nameParts[0] || '',
        last_name: nameParts.slice(1).join(' ') || ''
      }
    });
    sessionStorage.removeItem('mwc_lead');
  }

  gtag('event', 'conversion', {'send_to': 'AW-18339107903/45EVCMOQn9gcEL-o4qhE'});
</script>

<style>
  :root{
    --black:#02060d;
    --navy:#06162d;
    --navy2:#0a2a53;
    --blue:#0877ef;
    --blue2:#2ba6ff;
    --white:#f5f9ff;
    --muted:#a8b7c9;
    --line:rgba(110,177,247,.22);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 0%, var(--navy2), var(--black) 70%);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    padding:48px 32px;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(10,42,83,.35);
  }
  h1{margin:0 0 12px;font-size:1.8rem}
  p{color:var(--muted);line-height:1.6}
  a.btn{
    display:inline-block;
    margin-top:24px;
    padding:12px 28px;
    border-radius:999px;
    background:var(--blue);
    color:#fff;
    text-decoration:none;
    font-weight:600;
  }
  a.btn:hover{background:var(--blue2)}
</style>
</head>
<body>
  <div class="card">
    <h1>Thanks for reaching out!</h1>
    <p>We've received your quote request and will get back to you within 1-2 business days.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
